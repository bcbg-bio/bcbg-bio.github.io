- name: Brielin C Brown
  photo: brielin.jpg
  info: Brielin is an Assistant Professor in the Division of Informatics, Department of Biostatistics, Epidemiology and Informatics, with a secondary appointment in the Department of Genetics. Brielin broadly interested in the development and application of statistical and computational methods in genetics and genomics with a focus on complex traits. Brielin conducted postdoctoral training at the New York Genome Center, jointly advised by Dr's [David Knowles](https://daklab.github.io/) and [Tuuli Lappalainen](https://tllab.org/). He received the PhD from the Department of Computer Science at the University of California, Berkeley in 2016, jointly supervised by Dr's [Lior Pachter](https://pachterlab.github.io/) and [Noah Zaitlen](https://bioscience.ucla.edu/people/noah-zaitlen/). At Berkeley, he was the recipent of the Chancellor's Fellowship for Graduate Study and the NSF GRFP. Prior to joining NYGC, he worked as a computational biologist at [Verily Life Sciences](https://verily.com/). In a past life, he studied [quantum complexity theory](https://csdmp.github.io/docs/brown2011.pdf). In his spare time Brielin enjoys surfing, and collecting and mixing underground dance music. 
  email: brielin.brown@pennmedicine.upenn.edu
